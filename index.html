<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<!-- MMG CRM — dummy lead-intake CRM. One file, no backend, no dependencies.
     All data lives in this browser's localStorage under crm_* keys. Keep the prefix:
     GitHub Pages project pages on one account share a single origin, so any other
     app published under BIH-MMG.github.io would see these keys. -->
<title>MMG CRM</title>
<style>
  :root {
    --brand: #1F4E79;
    --brand-light: #2F6FA8;
    --bg: #F5F7FA;
    --card: #FFFFFF;
    --text: #1E2530;
    --muted: #6B7380;
    --border: #D8DEE8;
    --row-alt: #F3F6F8;
    --head: #EAF2F8;
    --ok-bg: #E3F3E6; --ok-text: #1E5B2E;
    --warn-bg: #FFF4E3; --warn-text: #8A5A16;
    --bad-bg: #FBE5E5; --bad-text: #8F2A2A;
    --danger: #B23B3B;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --brand: #3D7FBF;
      --brand-light: #5B98D3;
      --bg: #131820;
      --card: #1B222C;
      --text: #E6EAF0;
      --muted: #97A0AE;
      --border: #313B48;
      --row-alt: #1F2833;
      --head: #22303F;
      --ok-bg: #1B3A24; --ok-text: #9BDCA8;
      --warn-bg: #3F2E12; --warn-text: #F0C27A;
      --bad-bg: #40191C; --bad-text: #F2A0A0;
      --danger: #E06C6C;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  a { color: var(--brand); }
  header { background: var(--brand); color: #fff; display: flex; align-items: center; gap: 4px;
    padding: 0 16px; height: 48px; position: sticky; top: 0; z-index: 5; }
  header .brand { font-weight: 700; font-size: 16px; margin-right: 20px; letter-spacing: .3px; }
  header nav { display: flex; gap: 2px; flex: 1; overflow-x: auto; }
  header nav button { background: none; border: 0; color: rgba(255,255,255,.8); padding: 0 12px; height: 48px;
    font: inherit; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  header nav button.on { color: #fff; border-bottom-color: #fff; }
  header .newbtn { background: #fff; color: var(--brand); border: 0; border-radius: 6px; padding: 7px 14px;
    font: inherit; font-weight: 700; cursor: pointer; }
  main { max-width: 1240px; margin: 0 auto; padding: 18px 16px 60px; }
  h2 { font-size: 18px; margin: 0 0 12px; color: var(--brand); }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 22px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; box-shadow: var(--shadow); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .toolbar input[type=search] { flex: 1; min-width: 180px; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 9px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand-light); outline-offset: 0; border-color: transparent; }
  textarea { min-height: 70px; resize: vertical; }
  .toolbar select, .toolbar input[type=search] { width: auto; }
  button.btn { font: inherit; font-weight: 600; background: var(--brand); color: #fff; border: 0; border-radius: 6px;
    padding: 8px 14px; cursor: pointer; }
  button.btn.sec { background: var(--card); color: var(--brand); border: 1px solid var(--brand); }
  button.btn.danger { background: var(--danger); }
  button.btn.small { padding: 4px 9px; font-size: 12px; }
  button.btn:disabled { opacity: .5; cursor: default; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { background: var(--head); font-weight: 600; color: var(--brand); cursor: pointer; user-select: none; position: sticky; top: 48px; }
  th .dir { color: var(--muted); font-size: 11px; margin-left: 3px; }
  tbody tr { cursor: pointer; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--head); }
  td.name { font-weight: 600; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; background: var(--head); color: var(--brand); }
  .pill.ok { background: var(--ok-bg); color: var(--ok-text); }
  .pill.warn { background: var(--warn-bg); color: var(--warn-text); }
  .pill.bad { background: var(--bad-bg); color: var(--bad-text); }
  .pill.grey { background: var(--row-alt); color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 14px; }
  .grid label, .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; font-weight: 600; }
  .field { margin-bottom: 10px; }
  .span2 { grid-column: span 2; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > * { flex: 1; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; padding-top: 4px; }
  .checks label { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text); font-weight: 500; margin: 0; }
  .checks input { width: auto; }
  .two { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .two { grid-template-columns: 1fr; } .span2 { grid-column: span 1; } }
  .hint { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
  .hint:last-child { border-bottom: 0; }
  .hint .pill { flex-shrink: 0; min-width: 62px; text-align: center; }
  .hint b { display: block; }
  .hint span { color: var(--muted); font-size: 12px; }
  .log { list-style: none; padding: 0; margin: 0; }
  .log li { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .log li time { color: var(--muted); font-size: 11px; display: block; }
  .msg { color: var(--muted); font-size: 13px; margin-top: 6px; min-height: 18px; }
  .msg.err { color: var(--danger); }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  /* kanban */
  .board { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; align-items: flex-start; }
  .col { flex: 0 0 210px; background: var(--row-alt); border: 1px solid var(--border); border-radius: 8px; padding: 8px; min-height: 120px; }
  .col.over { outline: 2px dashed var(--brand-light); }
  .col h4 { margin: 0 0 8px; font-size: 12px; color: var(--brand); display: flex; justify-content: space-between; }
  .kcard { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin-bottom: 6px; cursor: grab; box-shadow: var(--shadow); }
  .kcard b { display: block; font-size: 13px; }
  .kcard small { color: var(--muted); display: block; }
  .kcard .mv { display: flex; justify-content: space-between; margin-top: 6px; }
  .kcard .mv button { background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--brand); cursor: pointer; font: inherit; padding: 1px 8px; }
  .kcard.late { border-left: 3px solid var(--danger); }
  /* dashboard */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; box-shadow: var(--shadow); }
  .stat .n { font-size: 26px; font-weight: 700; color: var(--brand); line-height: 1.1; }
  .stat .l { font-size: 12px; color: var(--muted); }
  .bars { display: grid; grid-template-columns: 150px 1fr 40px; gap: 6px 10px; align-items: center; font-size: 13px; }
  .bars .bar { background: var(--row-alt); border-radius: 4px; height: 14px; overflow: hidden; }
  .bars .bar i { display: block; height: 100%; background: var(--brand-light); }
  .bars .v { text-align: right; color: var(--muted); }
  .cols3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
  .late-text { color: var(--danger); font-weight: 600; }
  /* admin */
  .gate { max-width: 360px; margin: 48px auto 0; }
  .row .btn { flex: 0 0 auto; }
  table.admin tbody tr { cursor: default; }
  table.admin td select, table.admin td input { width: auto; padding: 4px 6px; }
  table.admin td .row { flex-wrap: nowrap; }
  table.admin td .row input { min-width: 140px; }
  footer { color: var(--muted); font-size: 11px; text-align: center; padding: 20px 0 0; }
</style>
</head>
<body>
<header>
  <div class="brand">MMG CRM</div>
  <nav id="tabs">
    <button data-tab="leads" class="on">Leads</button>
    <button data-tab="pipeline">Pipeline</button>
    <button data-tab="dashboard">Dashboard</button>
    <button data-tab="data">Data</button>
    <button data-tab="admin">Admin</button>
  </nav>
  <button class="newbtn" id="newLead">+ New lead</button>
</header>
<main id="main"></main>

<script>
'use strict';
// BUILD is checked against the live file after each deploy.
const BUILD = '2026-09-04-7';

// ---- Reference data ----------------------------------------------------------
const STAGES = [
  ['new',       'New lead'],
  ['booked',    'Free call booked'],
  ['held',      'Free call held'],
  ['agreed',    'Agreed to paid consult'],
  ['handoff',   'Handed to partner'],
  ['scheduled', 'Scheduling email sent'],
  ['paid',      'Paid'],
  ['consult',   'Paid consult held'],
  ['service',   'Service engagement'],
  ['closed',    'Closed'],
];
const STAGE_LABEL = Object.fromEntries(STAGES);
const STAGE_INDEX = Object.fromEntries(STAGES.map((s, i) => [s[0], i]));
const OUTCOMES = { won: 'Won', lost: 'Lost', notyet: 'Not yet' };
const DESTS = ['Canada', 'Spain', 'Thailand', 'Malta', 'Other'];
const SOURCES = ['Website form', 'Referral', 'Social media', 'Webinar', 'Partner', 'Walk-in / email', 'Other'];
const LANGS = ['English', 'Spanish', 'French', 'Japanese', 'Chinese', 'Other'];
const PARTY = { solo: 'Solo', couple: 'Couple', family: 'Family' };
const EMP = { employed: 'Employed (on-site)', remote: 'Employed (remote)', owner: 'Business owner', freelance: 'Freelance / contractor', retired: 'Retired', student: 'Student', other: 'Other' };
const INCOME_TYPE = { salary: 'Salary', remote: 'Remote work', business: 'Business income', passive: 'Passive / investments', pension: 'Pension', none: 'None' };
const TIMELINE = { now: 'Immediate', '3-6': '3–6 months', '6-12': '6–12 months', '12+': '12+ months', exploring: 'Just exploring' };
const INVEST = { none: 'None', rent: 'Would rent', buy: 'Would buy property' };
const FIRM = { none: 'No preference', large: 'Large full-service firm', small: 'Smaller cost-effective firm' };
const CURRENCIES = ['USD', 'EUR', 'CAD', 'GBP', 'THB', 'JPY'];
// Rough rates to USD, for screening hints only.
const TO_USD = { USD: 1, EUR: 1.08, CAD: 0.73, GBP: 1.27, THB: 0.028, JPY: 0.0067 };
const OWNERS_DEFAULT = ['Admin', 'Brian H.', 'Ana R.', 'Tom K.'];  // 'Admin' is the intake owner: every booking lands there first
const ROLE_DEFAULT = { Admin: 'admin' };
const ROLES = { rep: 'Rep', partner: 'Partner', admin: 'Admin' };
const PIN_DEFAULT = '0000';

// ---- Helpers -----------------------------------------------------------------
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function num(v) { const n = parseFloat(String(v).replace(/[, ]/g, '')); return isNaN(n) ? null : n; }
function fmtDate(iso) { return iso ? iso.slice(0, 10) : ''; }
function fmtMoney(n, cur) { return n == null ? '' : (cur || '') + ' ' + Math.round(n).toLocaleString('en-US'); }
function opts(map, sel, blank) {
  let h = blank ? '<option value="">' + esc(blank) + '</option>' : '';
  const entries = Array.isArray(map) ? map.map(v => [v, v]) : Object.entries(map);
  for (const [v, l] of entries) h += '<option value="' + esc(v) + '"' + (v === sel ? ' selected' : '') + '>' + esc(l) + '</option>';
  return h;
}
function isLate(lead) { return lead.stage !== 'closed' && !!lead.followUp && lead.followUp < todayStr(); }
function yearlyUSD(lead) {
  const n = num(lead.income); if (n == null) return null;
  const per = lead.incomePer === 'month' ? 12 : 1;
  return n * per * (TO_USD[lead.incomeCur] || 1);
}
function usd(lead, field) { const n = num(lead[field]); return n == null ? null : n * (TO_USD[lead.incomeCur] || 1); }
const USD_PER_EUR = TO_USD.EUR;

// ---- State & storage ---------------------------------------------------------
let leads = [];
let settings = normaliseSettings(null);
let view = { tab: 'leads', leadId: null, q: '', stage: '', dest: '', owner: '', sort: 'updated', dir: -1,
  adminOk: false, renaming: null, removing: null };

function loadAll() {
  try {
    const l = JSON.parse(localStorage.getItem('crm_leads') || 'null');
    if (Array.isArray(l)) leads = l.map(normalise);
  } catch (e) { console.error(e); leads = []; }
  try {
    const s = JSON.parse(localStorage.getItem('crm_settings') || 'null');
    if (s && typeof s === 'object') settings = normaliseSettings(s);
  } catch (e) { console.error(e); }
}
// settings = { owners: [name…] (all, in display order), ownerMeta: { name: { role, active } },
//              defaultOwner: name, pin: '0000' }. Leads reference owners by name.
function normaliseSettings(raw) {
  const s = Object.assign({ owners: [], ownerMeta: {}, defaultOwner: '', pin: PIN_DEFAULT }, raw && typeof raw === 'object' ? raw : {});
  s.owners = Array.isArray(s.owners) ? s.owners.map(o => String(o).trim()).filter(Boolean) : [];
  if (!s.owners.length) s.owners = OWNERS_DEFAULT.slice();
  const meta = s.ownerMeta && typeof s.ownerMeta === 'object' ? s.ownerMeta : {};
  s.ownerMeta = {};
  s.owners.forEach(o => { const m = meta[o] || {}; s.ownerMeta[o] = { role: ROLES[m.role] ? m.role : (ROLE_DEFAULT[o] || 'rep'), active: m.active !== false }; });
  if (!s.owners.includes(s.defaultOwner)) s.defaultOwner = s.owners[0];
  s.pin = /^\d{4,8}$/.test(String(s.pin)) ? String(s.pin) : PIN_DEFAULT;
  return s;
}
function saveLeads() { try { localStorage.setItem('crm_leads', JSON.stringify(leads)); return true; } catch (e) { console.error(e); return false; } }
function saveSettings() { try { localStorage.setItem('crm_settings', JSON.stringify(settings)); return true; } catch (e) { console.error(e); return false; } }

function blankLead() {
  const now = new Date().toISOString();
  return {
    id: uid(), created: now, updated: now,
    name: '', email: '', phone: '', lang: 'English', source: '', consent: false,
    nationality: '', resCountry: '', resCity: '', age: '',
    party: 'solo', dependants: '', pets: '',
    occupation: '', empMode: '', years: '', education: '',
    income: '', incomeCur: 'USD', incomePer: 'year', incomeType: '', liquid: '', assets: '',
    destinations: [], why: '', timeline: '', visa: '', invest: 'none', investBudget: '', firm: 'none',
    owner: '', stage: 'new', followUp: '', outcome: '', notes: '',
    log: [],
  };
}
function normalise(raw) {
  const l = Object.assign(blankLead(), raw || {});
  if (!Array.isArray(l.destinations)) l.destinations = [];
  if (!Array.isArray(l.log)) l.log = [];
  if (!STAGE_LABEL[l.stage]) l.stage = 'new';
  return l;
}
function findLead(id) { return leads.find(l => l.id === id) || null; }
function addLog(lead, text, kind) {
  lead.log.unshift({ t: new Date().toISOString(), text: text, kind: kind || 'note' });
}
function setStage(lead, stage, outcome) {
  if (!STAGE_LABEL[stage]) return false;
  if (lead.stage === stage && (stage !== 'closed' || lead.outcome === outcome)) return true;
  const from = lead.stage;
  lead.stage = stage;
  if (stage === 'closed') lead.outcome = outcome || lead.outcome || 'notyet'; else lead.outcome = '';
  lead.updated = new Date().toISOString();
  addLog(lead, STAGE_LABEL[from] + ' → ' + STAGE_LABEL[stage] + (stage === 'closed' ? ' (' + OUTCOMES[lead.outcome] + ')' : ''), 'stage');
  return true;
}

// ---- Owners (Admin tab) ------------------------------------------------------
// Every operation returns '' on success or an error string; storage failures roll back.
function activeOwners() { return settings.owners.filter(o => settings.ownerMeta[o] && settings.ownerMeta[o].active !== false); }
function ownerChoices(current) { const a = activeOwners(); return current && !a.includes(current) ? a.concat([current]) : a; }
function defaultOwner() { const a = activeOwners(); return a.includes(settings.defaultOwner) ? settings.defaultOwner : (a[0] || ''); }
function ownerOpenLeads(name) { return leads.filter(l => l.owner === name && l.stage !== 'closed').length; }
function ownerExists(name) { const n = name.toLowerCase(); return settings.owners.some(o => o.toLowerCase() === n); }
function snapshot(v) { return JSON.parse(JSON.stringify(v)); }
function commitOwners(snapS, snapL) {
  if (saveSettings() && (!snapL || saveLeads())) return '';
  settings = snapS; if (snapL) leads = snapL; saveSettings(); saveLeads();
  return 'Could not save — storage full. Nothing changed.';
}
function addOwner(name, role) {
  name = String(name || '').trim();
  if (!name) return 'Name required.';
  if (ownerExists(name)) return 'That owner already exists.';
  const snap = snapshot(settings);
  settings.owners.push(name); settings.ownerMeta[name] = { role: ROLES[role] ? role : 'rep', active: true };
  return commitOwners(snap);
}
function renameOwner(from, to) {
  to = String(to || '').trim();
  if (!settings.owners.includes(from)) return 'Unknown owner.';
  if (!to) return 'Name required.';
  if (to === from) return '';
  if (ownerExists(to)) return 'That owner already exists.';
  const snapS = snapshot(settings), snapL = snapshot(leads);
  settings.owners = settings.owners.map(o => o === from ? to : o);
  settings.ownerMeta[to] = settings.ownerMeta[from]; delete settings.ownerMeta[from];
  if (settings.defaultOwner === from) settings.defaultOwner = to;
  leads.forEach(l => { if (l.owner === from) l.owner = to; });
  if (view.owner === from) view.owner = to;
  return commitOwners(snapS, snapL);
}
function removeOwner(name, reassignTo) {
  if (!settings.owners.includes(name)) return 'Unknown owner.';
  if (settings.owners.length < 2) return 'Cannot remove the last owner.';
  const affected = leads.filter(l => l.owner === name);
  if (affected.length && (!reassignTo || reassignTo === name || !settings.owners.includes(reassignTo)))
    return 'Choose who takes over ' + affected.length + ' lead' + (affected.length === 1 ? '' : 's') + '.';
  const snapS = snapshot(settings), snapL = snapshot(leads);
  settings.owners = settings.owners.filter(o => o !== name); delete settings.ownerMeta[name];
  if (settings.defaultOwner === name) settings.defaultOwner = settings.owners[0];
  const now = new Date().toISOString();
  affected.forEach(l => { l.owner = reassignTo; l.updated = now; addLog(l, 'Reassigned from ' + name + ' to ' + reassignTo, 'note'); });
  if (view.owner === name) view.owner = '';
  return commitOwners(snapS, snapL);
}
function setOwnerMeta(name, patch) {
  if (!settings.ownerMeta[name]) return 'Unknown owner.';
  const snap = snapshot(settings);
  Object.assign(settings.ownerMeta[name], patch);
  if (!ROLES[settings.ownerMeta[name].role]) settings.ownerMeta[name].role = 'rep';
  return commitOwners(snap);
}
function setDefaultOwner(name) {
  if (!settings.owners.includes(name)) return 'Unknown owner.';
  const snap = snapshot(settings); settings.defaultOwner = name; return commitOwners(snap);
}
function setPin(pin) {
  pin = String(pin || '').trim();
  if (!/^\d{4,8}$/.test(pin)) return 'PIN must be 4–8 digits.';
  const snap = snapshot(settings); settings.pin = pin; return commitOwners(snap);
}

// ---- Screening hints ---------------------------------------------------------
// Rule-of-thumb fit against the Ready Reckoner thresholds. Never a processing
// time, never a Canadian settlement-funds figure, never a TEER code or CRS score.
function screeningHints(lead) {
  const out = [];
  const yr = yearlyUSD(lead);
  const mo = yr == null ? null : yr / 12;
  const liquid = usd(lead, 'liquid'), assets = usd(lead, 'assets');
  const age = num(lead.age);
  const deps = (String(lead.dependants).match(/\d+/g) || []).length + (lead.party === 'couple' || lead.party === 'family' ? 1 : 0);
  const remoteWork = lead.empMode === 'remote' || lead.empMode === 'freelance' || lead.incomeType === 'remote';
  const passive = lead.incomeType === 'passive' || lead.incomeType === 'pension' || lead.empMode === 'retired';
  const visa = String(lead.visa).toLowerCase();
  const has = d => lead.destinations.includes(d);
  const H = (prog, verdict, note) => out.push({ prog, verdict, note });

  if (has('Spain')) {
    if (/golden/.test(visa)) H('Spain Golden Visa', 'no', 'Discontinued for new applicants. Pivot to Non-Lucrative, Portugal Golden Visa (€500k funds, 14 days per 2 years) or Malta MPRP.');
    if (lead.empMode === 'retired') H('Spain Digital Nomad', 'unlikely', 'Needs active remote work for a non-Spanish employer or clients.');
    else if (mo == null) H('Spain Digital Nomad', 'check', 'Needs remote income ≥ €2,849/month (200% SMI, rises with family), employer >1 year old, >3 months with them, ≤20% from Spanish clients.');
    else if (remoteWork && mo >= 2849 * USD_PER_EUR) H('Spain Digital Nomad', 'fit', 'Remote income clears €2,849/month. Confirm employer age >1 year, >3 months with them, ≤20% Spanish-sourced.');
    else if (remoteWork) H('Spain Digital Nomad', 'unlikely', 'Remote income below ~€2,849/month.');
    else H('Spain Digital Nomad', 'check', 'Only if the work can be done remotely for a non-Spanish company or clients.');
    const nlvNeed = (28800 + 7200 * deps) * USD_PER_EUR;
    if (yr != null && passive && yr >= nlvNeed) H('Spain Non-Lucrative', 'fit', 'Passive income clears 400% IPREM (~€28,800 + €7,200 per family member). No work of any kind, including remote.');
    else if (yr != null && passive) H('Spain Non-Lucrative', 'unlikely', 'Passive income below ~€' + Math.round(nlvNeed / USD_PER_EUR).toLocaleString('en-US') + '/year for this family size. Savings can count — consultant to confirm.');
    else if (remoteWork) H('Spain Non-Lucrative', 'no', 'NLV forbids any work, including remote. Digital Nomad is the route.');
    else H('Spain Non-Lucrative', 'check', 'Needs ~€28,800/year passive or savings, +€7,200 per family member. No work allowed.');
  }
  if (has('Thailand')) {
    if (age != null && age >= 50 && yr != null && yr >= 80000 && passive) H('Thailand LTR — Wealthy Pensioner', 'fit', 'Age 50+ with ≥ $80k/year pension or passive income.');
    else if (age != null && age >= 50) H('Thailand LTR — Wealthy Pensioner', 'check', 'Age qualifies; needs ≥ $80k/year pension or passive income (lower with $250k invested — consultant).');
    if (remoteWork && yr != null && yr >= 80000 && (num(lead.years) || 0) >= 5) H('Thailand LTR — Work-from-Thailand', 'fit', 'Remote for an overseas employer, ≥ $80k/year, 5+ years experience. Employer test applies — consultant.');
    else if (remoteWork) H('Thailand LTR — Work-from-Thailand', 'check', 'Needs ≥ $80k/year (lower with a master’s), 5 years experience, qualifying overseas employer.');
    if (assets != null && assets >= 1000000 && yr != null && yr >= 80000) H('Thailand LTR — Wealthy Global Citizen', 'check', 'Assets and income clear; also needs $500k invested in Thailand.');
    H('Thailand Privilege', 'fit', 'No eligibility test — membership fee from THB 650,000 (5 years). No employment permitted.');
    if (/permanent|pr\b/.test(visa)) H('Thailand PR', 'no', 'Not a day-one route: 3+ years of annual extensions, Thai tax history, Thai language interview, nationality quota.');
  }
  if (has('Malta')) {
    if (assets != null && liquid != null && assets >= 500000 * USD_PER_EUR && liquid >= 150000 * USD_PER_EUR) H('Malta MPRP', 'fit', '€500k total assets with €150k liquid clears. Budget ~€99k in fees plus property (buy ≥ €375k or rent ≥ €14k/year). No minimum stay.');
    else if (assets != null || liquid != null) H('Malta MPRP', 'unlikely', 'Needs €500k total assets of which €150k liquid (alternative €650k/€75k route — consultant).');
    else H('Malta MPRP', 'check', 'Needs €500k total assets, €150k liquid, ~€99k fees and a qualifying property.');
    if (passive || yr != null) H('Malta GRP', 'check', 'Tax-status route: stable regular income, 15% on remitted income (min €15k tax), property, not >183 days elsewhere. Renewed annually.');
  }
  if (has('Canada')) {
    if (lead.empMode === 'retired') H('Canada Express Entry', 'unlikely', 'Points-based on skilled work, language and education; retirees rarely score.');
    else if (lead.occupation) H('Canada Express Entry', 'check', 'Skilled work (TEER 0–3), approved language test, ECA for foreign degrees. Consultant assigns TEER and CRS.');
    else H('Canada Express Entry', 'check', 'Need occupation, education and language details first.');
    if (lead.empMode !== 'retired') H('Canada PNP', 'check', 'Usually needs a job offer in the province. Enhanced nominations add 600 CRS points.');
    if (/famil|sponsor|sister|brother|parent|spouse/.test((lead.why + ' ' + visa).toLowerCase())) H('Canada Family Sponsorship', 'check', 'Sponsor must be a citizen or PR aged 18+ and sign a financial undertaking.');
  }
  return out;
}

function filteredLeads() {
  const q = view.q.trim().toLowerCase();
  let rows = leads.filter(l =>
    (!view.stage || l.stage === view.stage) &&
    (!view.dest || l.destinations.includes(view.dest)) &&
    (!view.owner || l.owner === view.owner) &&
    (!q || [l.name, l.email, l.phone, l.nationality, l.resCity, l.occupation, l.why, l.visa, l.notes].join(' ').toLowerCase().includes(q)));
  const k = view.sort, dir = view.dir;
  rows.sort((a, b) => {
    let x = a[k], y = b[k];
    if (k === 'stage') { x = STAGE_INDEX[a.stage]; y = STAGE_INDEX[b.stage]; }
    if (k === 'destinations') { x = a.destinations.join(); y = b.destinations.join(); }
    if (k === 'income') { x = yearlyUSD(a) || 0; y = yearlyUSD(b) || 0; }
    if (x == null || x === '') return 1; if (y == null || y === '') return -1;
    return (x < y ? -1 : x > y ? 1 : 0) * dir;
  });
  return rows;
}

function saveForm(l) {

// -- Pipeline
function renderPipeline() {
  let h = '<div class="board">';
  for (const [key, label] of STAGES) {
    const items = leads.filter(l => l.stage === key).sort((a, b) => (a.followUp || 'z') < (b.followUp || 'z') ? -1 : 1);
    h += '<div class="col" data-stage="' + key + '"><h4>' + esc(label) + '<span>' + items.length + '</span></h4>';
    for (const l of items) {
      const i = STAGE_INDEX[key];
      h += '<div class="kcard' + (isLate(l) ? ' late' : '') + '" draggable="true" data-id="' + l.id + '"><b>' + esc(l.name || '(unnamed)') + '</b>' +
        '<small>' + esc(l.destinations.join(', ') || '—') + ' · ' + esc(l.owner || '—') + '</small>' +
        (l.followUp && key !== 'closed' ? '<small' + (isLate(l) ? ' class="late-text"' : '') + '>Follow-up ' + esc(l.followUp) + '</small>' : '') +
        (key === 'closed' ? '<small>' + esc(OUTCOMES[l.outcome] || '') + '</small>' : '') +
        '<div class="mv"><button data-mv="-1"' + (i === 0 ? ' disabled' : '') + '>‹</button><button data-mv="1"' + (i === STAGES.length - 1 ? ' disabled' : '') + '>›</button></div></div>';
    }
    h += '</div>';
  }
  h += '</div>';
  main().innerHTML = h;
  document.querySelectorAll('.kcard').forEach(c => {
    c.onclick = e => { if (e.target.tagName !== 'BUTTON') openLead(c.dataset.id); };
    c.ondragstart = e => { e.dataTransfer.setData('text/plain', c.dataset.id); };
    c.querySelectorAll('button[data-mv]').forEach(b => b.onclick = e => {
      e.stopPropagation();
      const l = findLead(c.dataset.id); const to = STAGES[STAGE_INDEX[l.stage] + Number(b.dataset.mv)];
      if (to) moveLead(l, to[0]);
    });
  });
  document.querySelectorAll('.col').forEach(col => {
    col.ondragover = e => { e.preventDefault(); col.classList.add('over'); };
    col.ondragleave = () => col.classList.remove('over');
    col.ondrop = e => { e.preventDefault(); col.classList.remove('over'); const l = findLead(e.dataTransfer.getData('text/plain')); if (l) moveLead(l, col.dataset.stage); };
  });
}
function moveLead(l, stage) {
  const snap = JSON.stringify(l);
  let outcome = '';
  if (stage === 'closed') { const o = prompt('Outcome: won, lost or notyet', 'won'); if (o == null) return; outcome = OUTCOMES[o.trim().toLowerCase()] ? o.trim().toLowerCase() : 'notyet'; }
  setStage(l, stage, outcome);
  if (!saveLeads()) { Object.assign(l, JSON.parse(snap)); alert('Could not save the change.'); return; }
  renderPipeline();
}

// -- Dashboard
function renderDashboard() {
  const open = leads.filter(l => l.stage !== 'closed');
  const heldN = leads.filter(l => STAGE_INDEX[l.stage] >= STAGE_INDEX.held).length;
  const agreedN = leads.filter(l => STAGE_INDEX[l.stage] >= STAGE_INDEX.agreed && !(l.stage === 'closed' && l.outcome !== 'won')).length;
  const conv = heldN ? Math.round(100 * agreedN / heldN) : null;
  const late = leads.filter(isLate);
  const won = leads.filter(l => l.stage === 'closed' && l.outcome === 'won').length;
  const paidN = leads.filter(l => STAGE_INDEX[l.stage] >= STAGE_INDEX.paid && l.stage !== 'closed').length + won;
  const count = (arr, key) => { const m = {}; arr.forEach(l => { const ks = key(l); (Array.isArray(ks) ? ks : [ks]).forEach(k => { k = k || '—'; m[k] = (m[k] || 0) + 1; }); }); return m; };
  const bars = (m, order) => {
    const keys = order || Object.keys(m).sort((a, b) => m[b] - m[a]); const max = Math.max(1, ...Object.values(m));
    return '<div class="bars">' + keys.map(k => '<div>' + esc(k) + '</div><div class="bar"><i style="width:' + (100 * (m[k] || 0) / max) + '%"></i></div><div class="v">' + (m[k] || 0) + '</div>').join('') + '</div>';
  };
  let h = '<div class="stats">' +
    stat(leads.length, 'Leads') + stat(open.length, 'Open') + stat(conv == null ? '—' : conv + '%', 'Free call → paid consult') +
    stat(paidN, 'Paid consultations') + stat(won, 'Won') + stat(late.length, 'Overdue follow-ups', late.length ? 'late-text' : '') + '</div>';
  h += '<div class="cols3">' +
    '<div class="card"><h3 style="margin-top:0">By stage</h3>' + bars(count(leads, l => STAGE_LABEL[l.stage]), STAGES.map(s => s[1])) + '</div>' +
    '<div class="card"><h3 style="margin-top:0">By destination</h3>' + bars(count(open, l => l.destinations)) + '</div>' +
    '<div class="card"><h3 style="margin-top:0">By owner (open)</h3>' + bars(count(open, l => l.owner)) + '</div>' +
    '<div class="card"><h3 style="margin-top:0">By source</h3>' + bars(count(leads, l => l.source)) + '</div>' +
    '</div>';
  h += '<div class="card" style="margin-top:14px"><h3 style="margin-top:0">Overdue follow-ups</h3>' +
    (late.length ? '<div class="tablewrap"><table><thead><tr><th>Name</th><th>Stage</th><th>Owner</th><th>Due</th></tr></thead><tbody>' +
      late.sort((a, b) => a.followUp < b.followUp ? -1 : 1).map(l => '<tr data-id="' + l.id + '"><td class="name">' + esc(l.name) + '</td><td>' + stagePill(l) + '</td><td>' + esc(l.owner) + '</td><td class="late-text">' + esc(l.followUp) + '</td></tr>').join('') +
      '</tbody></table></div>' : '<div class="msg">None.</div>') + '</div>';
  main().innerHTML = h;
  document.querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = () => openLead(tr.dataset.id));
}
function stat(n, label, cls) { return '<div class="stat"><div class="n' + (cls ? ' ' + cls : '') + '">' + esc(n) + '</div><div class="l">' + esc(label) + '</div></div>'; }

// ---- Backup & Restore (same shape as the other apps) ------------------------
function backupData() { return { leads: leads, settings: settings }; }
function backupText() { return JSON.stringify({ app: 'mmg-crm', v: 1, exported: new Date().toISOString(), data: backupData() }, null, 1); }
function backupFilename() { return 'mmg-crm-backup-' + todayStr() + '.json'; }
function validBackup(data) { return !!data && Array.isArray(data.leads) && data.leads.every(l => l && typeof l === 'object'); }
function parseBackup(text) {
  let obj; try { obj = JSON.parse(text); } catch (e) { return { error: 'That is not valid JSON.' }; }
  if (obj && obj.app && obj.app !== 'mmg-crm') return { error: 'That is a backup from ' + obj.app + ', not this app.' };
  const data = obj && obj.app ? obj.data : obj;
  if (!validBackup(data)) return { error: 'That does not look like an MMG CRM backup.' };
  return { data: data };
}
function applyBackup(data) {
  const snapL = leads, snapS = settings;
  leads = data.leads.map(normalise);
  if (data.settings && typeof data.settings === 'object') settings = normaliseSettings(data.settings);
  if (!saveLeads() || !saveSettings()) { leads = snapL; settings = snapS; saveLeads(); saveSettings(); return false; }
  return true;
}
function restoreFromText(text, confirmed) {
  const r = parseBackup(text); if (r.error) return r.error;
  if (!confirmed && !confirm('Replace all ' + leads.length + ' leads with the ' + r.data.leads.length + ' in this backup?')) return 'Cancelled.';
  return applyBackup(r.data) ? 'Restored ' + leads.length + ' leads.' : 'Restore failed — storage full. Nothing changed.';
}
function csvText() {
  const cols = ['name', 'stage', 'outcome', 'owner', 'followUp', 'email', 'phone', 'lang', 'source', 'consent', 'nationality', 'resCountry', 'resCity', 'age', 'party', 'dependants', 'pets',
    'occupation', 'empMode', 'years', 'education', 'income', 'incomeCur', 'incomePer', 'incomeType', 'liquid', 'assets', 'destinations', 'why', 'timeline', 'visa', 'invest', 'investBudget', 'firm', 'notes', 'created', 'updated'];
  const cell = v => { v = Array.isArray(v) ? v.join('; ') : v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return [cols.join(',')].concat(leads.map(l => cols.map(c => cell(l[c])).join(','))).join('\n');
}
function download(text, name, type) {
  const blob = new Blob([text], { type: type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

function renderData() {
  let h = '<div class="cols3">';
  h += '<div class="card"><h3 style="margin-top:0">Sample data</h3>' +
    '<div class="toolbar"><button class="btn" id="loadSample">Load sample leads</button><button class="btn danger" id="clearAll">Clear all leads</button></div>' +
    '<div class="msg" id="sampleMsg">' + leads.length + ' leads stored in this browser.</div></div>';
  h += '<div class="card"><h3 style="margin-top:0">Export</h3>' +
    '<div class="toolbar"><button class="btn" id="dlJson">Download backup (JSON)</button><button class="btn sec" id="dlCsv">Download CSV</button><button class="btn sec" id="copyJson">Copy backup text</button></div>' +
    '<div class="msg" id="exportMsg"></div></div>';
  h += '<div class="card"><h3 style="margin-top:0">Restore</h3>' +
    '<div class="toolbar"><input type="file" id="restoreFile" accept=".json,application/json"></div>' +
    '<textarea id="restoreText" placeholder="Or paste backup text here"></textarea>' +
    '<div class="toolbar" style="margin-top:8px"><button class="btn sec" id="restoreBtn">Restore from text</button><span class="msg" id="restoreMsg"></span></div></div>';
  h += '</div><footer>All data is stored only in this browser (localStorage). Build ' + BUILD + '</footer>';
  main().innerHTML = h;

  el('loadSample').onclick = () => {
    if (leads.length && !confirm('Add ' + TRAINING.length + ' sample leads to the ' + leads.length + ' already here?')) return;
    const snap = leads; leads = sampleLeads().concat(leads);
    if (!saveLeads()) { leads = snap; el('sampleMsg').textContent = 'Could not save — storage full.'; return; }
    if (!settings.owners.includes('Admin')) addOwner('Admin', 'admin');  // older saved settings predate the intake owner
    renderData(); el('sampleMsg').textContent = 'Sample leads loaded. ' + leads.length + ' leads stored.';
  };
  el('clearAll').onclick = () => {
    if (!confirm('Delete all ' + leads.length + ' leads? Take a backup first if you want them back.')) return;
    const snap = leads; leads = [];
    if (!saveLeads()) { leads = snap; return; }
    renderData();
  };
  el('dlJson').onclick = () => download(backupText(), backupFilename(), 'application/json');
  el('dlCsv').onclick = () => download(csvText(), 'mmg-crm-leads-' + todayStr() + '.csv', 'text/csv');
  el('copyJson').onclick = async () => {
    try { await navigator.clipboard.writeText(backupText()); el('exportMsg').textContent = 'Copied.'; }
    catch (e) { el('exportMsg').textContent = 'Clipboard blocked — use the download instead.'; }
  };
  el('restoreBtn').onclick = () => { const m = restoreFromText(el('restoreText').value); renderDataKeepMsg(m); };
  el('restoreFile').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { const m = restoreFromText(String(rd.result)); renderDataKeepMsg(m); };
    rd.readAsText(f);
  };
}
function renderDataKeepMsg(m) { renderData(); el('restoreMsg').textContent = m; }

// ---- Admin (mock — the PIN gate is a demo, not security) ---------------------
function renderAdmin() {
  if (!view.adminOk) {
    main().innerHTML = '<div class="card gate"><h3 style="margin-top:0">Admin</h3><form id="pinForm" autocomplete="off">' +
      '<div class="row"><input type="password" id="pin" inputmode="numeric" placeholder="PIN" autofocus><button class="btn" type="submit">Unlock</button></div>' +
      '<div class="msg" id="pinMsg"></div></form></div>';
    el('pinForm').onsubmit = e => {
      e.preventDefault();
      if (el('pin').value === settings.pin) { view.adminOk = true; renderAdmin(); }
      else { el('pinMsg').textContent = 'Wrong PIN.'; el('pin').value = ''; }
    };
    return;
  }
  const others = name => settings.owners.filter(o => o !== name);
  let h = '<div class="toolbar"><h2 style="margin:0;flex:1">Admin</h2><button class="btn sec small" id="lock">Lock</button></div>';
  h += '<div class="card"><h3 style="margin-top:0">Owners</h3><div class="tablewrap"><table class="admin" id="ownerTable"><thead><tr>' +
    '<th>Name</th><th>Role</th><th>Active</th><th>Default</th><th>Open leads</th><th></th></tr></thead><tbody>';
  settings.owners.forEach(o => {
    const m = settings.ownerMeta[o];
    const renaming = view.renaming === o, removing = view.removing === o;
    h += '<tr data-o="' + esc(o) + '">' +
      '<td class="name">' + (renaming ?
        '<div class="row"><input data-act="renameVal" value="' + esc(o) + '"><button class="btn small" data-act="renameOk">Save</button><button class="btn sec small" data-act="cancel">Cancel</button></div>' :
        esc(o)) + '</td>' +
      '<td><select data-act="role">' + opts(ROLES, m.role) + '</select></td>' +
      '<td><input type="checkbox" data-act="active"' + (m.active ? ' checked' : '') + '></td>' +
      '<td><input type="radio" name="def" data-act="default"' + (settings.defaultOwner === o ? ' checked' : '') + (m.active ? '' : ' disabled') + '></td>' +
      '<td>' + ownerOpenLeads(o) + '</td>' +
      '<td>' + (removing ?
        '<div class="row">' + (leads.some(l => l.owner === o) ? '<select data-act="reassignTo">' + opts(others(o), '', 'Reassign to…') + '</select>' : '') +
          '<button class="btn danger small" data-act="removeOk">Remove</button><button class="btn sec small" data-act="cancel">Cancel</button></div>' :
        '<button class="btn sec small" data-act="rename">Rename</button> <button class="btn danger small" data-act="remove"' + (settings.owners.length < 2 ? ' disabled' : '') + '>Remove</button>') +
      '</td></tr>';
  });
  h += '</tbody></table></div><div class="msg" id="ownerMsg"></div></div>';
  h += '<div class="cols3" style="margin-top:14px">';
  h += '<div class="card"><h3 style="margin-top:0">Add owner</h3><form id="addForm" autocomplete="off"><div class="row">' +
    '<input id="newName" placeholder="Name"><select id="newRole">' + opts(ROLES, 'rep') + '</select><button class="btn" type="submit">Add</button></div>' +
    '<div class="msg" id="addMsg"></div></form></div>';
  h += '<div class="card"><h3 style="margin-top:0">Admin PIN</h3><form id="pinForm" autocomplete="off"><div class="row">' +
    '<input type="password" id="newPin" inputmode="numeric" placeholder="New PIN"><button class="btn sec" type="submit">Change</button></div>' +
    '<div class="msg" id="pinMsg"></div></form></div>';
  h += '</div>';
  main().innerHTML = h;

  const done = m => { view.renaming = view.removing = null; renderAdmin(); if (m) el('ownerMsg').textContent = m; };
  el('lock').onclick = () => { view.adminOk = false; done(); };
  document.querySelectorAll('#ownerTable tr[data-o]').forEach(tr => {
    const o = tr.dataset.o;
    const act = a => tr.querySelector('[data-act="' + a + '"]');
    const on = (a, ev, fn) => { const n = act(a); if (n) n[ev] = fn; };
    on('role', 'onchange', e => done(setOwnerMeta(o, { role: e.target.value })));
    on('active', 'onchange', e => done(setOwnerMeta(o, { active: e.target.checked })));
    on('default', 'onchange', () => done(setDefaultOwner(o)));
    on('rename', 'onclick', () => { view.renaming = o; view.removing = null; renderAdmin(); });
    on('remove', 'onclick', () => { view.removing = o; view.renaming = null; renderAdmin(); });
    on('cancel', 'onclick', () => done());
    const rename = () => { const m = renameOwner(o, act('renameVal').value); if (m) el('ownerMsg').textContent = m; else done(); };
    on('renameOk', 'onclick', rename);
    on('renameVal', 'onkeydown', e => { if (e.key === 'Enter') { e.preventDefault(); rename(); } if (e.key === 'Escape') done(); });
    on('removeOk', 'onclick', () => { const s = act('reassignTo'); const m = removeOwner(o, s ? s.value : ''); if (m) el('ownerMsg').textContent = m; else done('Removed ' + o + '.'); });
  });
  if (view.renaming) { const i = document.querySelector('#ownerTable [data-act="renameVal"]'); if (i) { i.focus(); i.select(); } }
  el('addForm').onsubmit = e => {
    e.preventDefault();
    const m = addOwner(el('newName').value, el('newRole').value);
    if (m) { el('addMsg').textContent = m; return; }
    done(); el('newName').focus();
  };
  el('pinForm').onsubmit = e => {
    e.preventDefault();
    const m = setPin(el('newPin').value);
    el('pinMsg').textContent = m || 'PIN changed.';
    if (!m) el('newPin').value = '';
  };
}

// ---- Boot --------------------------------------------------------------------
function boot() {
  loadAll();
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
  el('newLead').onclick = newLead;
  render();
}
if (typeof document !== 'undefined' && document.getElementById('main')) boot();
</script>
</body>
